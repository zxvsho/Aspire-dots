# Presets de solo lectura. Las variantes comparten plantilla; solo cambian
# paleta y geometría. Editar este archivo para ajustar radius/gap/padding.

[[theme]]
name = "catppuccin-mocha"
display-name = "Catppuccin Mocha"
description = "Cápsulas suaves con la variante oscura de Catppuccin."
palette = "catppuccin-mocha"
template = "capsule"
radius = 12
gap = 4
padding = 10

