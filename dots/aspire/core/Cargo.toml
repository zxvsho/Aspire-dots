[package]
name = "aspire-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo compartido de las apps aspire: motor de color (matugen/tinty) y lectura de la paleta theme-engine"

[lib]
name = "aspire_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
