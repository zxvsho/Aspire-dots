[package]
name = "aspire-menu"
version = "0.1.0"
edition = "2021"
description = "MangoWM Aspire Menu - Relm4/GTK4 layer-shell launcher with nested search and live theming"

[dependencies]
aspire-core = { path = "../core" }
relm4 = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
anyhow = "1.0"
fuzzy-matcher = "0.3"
once_cell = "1.19"
shellexpand = "3.0"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true