[package]
name = "aspire-clip"
version = "0.1.0"
edition = "2021"
description = "MangoWM clipboard picker with preview - GTK4 layer-shell, reads cliphist"

[dependencies]
aspire-core = { path = "../core" }
relm4 = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
gdk-pixbuf = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
