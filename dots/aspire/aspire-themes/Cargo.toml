[package]
name = "aspire-themes"
version = "0.1.0"
edition = "2021"
description = "MangoWM theme selector with preview - Relm4/GTK4 layer-shell"

[dependencies]
aspire-core = { path = "../core" }
relm4 = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
toml = "0.8"
dirs = "5.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"