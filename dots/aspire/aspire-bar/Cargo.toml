[package]
name = "aspire-bar"
version = "0.1.0"
edition = "2021"
description = "MangoWM Waybar visual editor - Rust + GTK4"

[dependencies]
aspire-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
toml = "0.8"
dirs = "5.0"
anyhow = "1.0"
tar = "0.4"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"