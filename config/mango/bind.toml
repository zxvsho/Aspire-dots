"SUPER+ALT+SHIFT+b" = "spawn_shell,pkill -x aspire-bar || ~/.local/bin/aspire-bar"
"SUPER+v" = "spawn_shell,pkill -x aspire-clip || ~/.local/bin/aspire-clip"
"SUPER+e" = "spawn_shell,pkill -x aspire-files || ~/.local/bin/aspire-files"
