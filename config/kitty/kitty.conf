font_family JetBrainsMonoNL Nerd Font
# Tema (matugen, tinty)
include ~/.config/kitty/theme.conf

# Font
font_size 11.0


# Transparencia y Desenfocado (Blur)
background_opacity        0.9
background_blur            1

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (Reducido para que fastfetch no se vea alejado del borde)
window_margin_width 0
window_padding_width 12

# No stupid close confirmation
confirm_os_window_close 0

# Use zsh shell
shell zsh

# Copy & Paste Setup
copy_on_select yes
map ctrl+v paste_from_clipboard
map ctrl+c copy_or_interrupt

# Search
map ctrl+f    launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0


# Activar el control remoto y el layout de divisiones
allow_remote_control yes
listen_on unix:@mykitty
enabled_layouts splits,stack

# Atajos de teclado para dividir la pantalla (Splits)
# Abre la nueva división manteniendo el mismo directorio actual (cwd)
map ctrl+shift+n launch --location=vsplit --cwd=current
map ctrl+shift+m launch --location=hsplit --cwd=current

# Atajos opcionales para moverte entre las pantallas divididas
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down




