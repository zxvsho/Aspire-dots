[theme]
engine = "auto"
colors_file = "~/.config/theme-engine/current/colors.css"

[general]
folders_first = true
expandable_folders = false
open_action = "double"
optional_actions = [
    "create_link",
    "delete_permanently",
]

[view]
view_mode = "grid"
icon_size = 128
show_hidden = false
sort_by = "modified"
sort_descending = false
search_subfolders = false
show_thumbnails = true
count_items_in_folders = true
date_format = "simple"

[window]
sidebar_visible = true
